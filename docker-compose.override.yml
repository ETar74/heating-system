services:
  # Dev-инструменты (подхватываются автоматически вместе с основным compose)
  prisma-studio:
    image: node:20-alpine
    container_name: heating_prisma_studio
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5555:5555"
    command: sh -c "npm install && npx prisma studio --browser none"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/heating_system
    depends_on:
      - postgres
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: heating_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@heating.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres