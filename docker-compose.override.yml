services:
  # Dev-инструменты (подхватываются автоматически вместе с основным compose)
  prisma-studio:
    image: node:20-alpine
    container_name: heating_prisma_studio
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - sqlite_data:/app/data
    ports:
      - "5555:5555"
    command: sh -c "npm install && npx prisma studio --browser none"
    environment:
      - DATABASE_URL=file:/app/data/heating.db