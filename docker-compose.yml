#version: '3.8'

services:
  # Backend (Node.js + Express + SQLite)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heating_backend
    restart: unless-stopped
    # JWT_SECRET, ESP32_TOKEN, CORS_ORIGINS и т.д. — из .env (см. README)
    env_file: .env
    environment:
      # SQLite: файл БД хранится в persistent volume (не теряется при пересоздании)
      DATABASE_URL: file:/app/data/heating.db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - sqlite_data:/app/data
    networks:
      - heating_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: >
      sh -c "npx prisma db push && npm start"

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heating_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # По умолчанию — http://localhost:3000 (браузер на том же хосте).
      # Для доступа с других машин задайте VITE_API_URL в .env (см. .env.prod).
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - heating_network
    depends_on:
      - backend

volumes:
  sqlite_data:

networks:
  heating_network:
    driver: bridge